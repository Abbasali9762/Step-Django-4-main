{% extends "base.html" %}

{% block title %}Kateqoriyalar{% endblock %}

{% block content %}
  {# [PRAKTİKA 8] #}
  <h1>Kateqoriyalar</h1>

  <ul class="list">
    {% for category in categories %}
      <li>

      </li>
    {% endfor %}
  </ul>
{% endblock %}
